[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-backend"
version = "0.1.0"
description = "CareFlow Tracker backend: Vogent function boundary, simulators, evidence, status derivation"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "structlog>=24.4",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
evals = ["playwright>=1.47"]
worker = ["boto3>=1.35", "moto[server]>=5.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires DATABASE_URL (skipped when unset)"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Correctness and safety first, then the readability rules that actually catch bugs.
select = ["E", "F", "W", "I", "B", "SIM", "RET", "RUF", "S", "PL", "FURB", "UP", "C4"]
ignore = [
    "S101",     # asserts are the point in tests
    "PLR0913",  # explicit keyword arguments beat bundling into an options object
    "PLR0917",  # same: these are keyword-only call sites, not positional sprawl
    "PLR2004",  # comparing against a literal status is clearer than naming every one
    "E501",     # line length is handled by the formatter
    # derive_status is a decision table. Its returns and branches are the design, and
    # collapsing them would hide the thing the whole project is about.
    "PLR0911",
    "PLR0912",
    # Lazy imports are deliberate: Playwright and the optimised strategy are heavy and
    # only needed on the voice path, so importing them at module scope would make
    # `make replay` pay for a browser driver it never uses.
    "PLC0415",
    # The connection pool is a process-level singleton by design, reset explicitly in tests.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# Fixture and default values that look like credentials to a scanner but are not:
# test tokens, and the "actor" default on a staff action.
"tests/*" = [
    "S105", "S106", "S107",
    # Some tests exist precisely to prove that typographic punctuation is handled,
    # so the ambiguous characters are the subject matter, not an accident.
    "RUF001", "RUF002",
]
"app/api/*" = ["S107"]
"app/persistence/*" = ["S107"]

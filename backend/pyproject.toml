[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-backend"
version = "0.1.0"
description = "CareFlow Tracker backend: Vogent function boundary, simulators, evidence, status derivation"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "structlog>=24.4",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
evals = ["playwright>=1.47"]
worker = ["boto3>=1.35", "moto[server]>=5.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires DATABASE_URL (skipped when unset)"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

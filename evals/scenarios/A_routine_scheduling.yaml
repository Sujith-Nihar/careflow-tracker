id: A_routine_scheduling
version: 1
risk: low
true_intent: routine_scheduling
caller:
  goal: "Book a routine post-surgery follow-up appointment"
  patient_ref: "PT-SYN-0001"
  callback_phone: "+15555550101"
  turns:
    - when: "routine|schedule|appointment|surgery|concern|how can i help|calling about"
      say: "I would like to make a routine appointment please."
    - when: "when|what day|which day|date|prefer|come in|works for you"
      say: "Next Tuesday would work well for me."
    - when: "what time|time works|morning or afternoon|time of day"
      say: "Any time in the morning is fine."
    - when: "anything else|else i can|all set|is booked|have you booked|confirmed for"
      say: "No, that's everything. Thank you."
  fallback_say: "I would like to make a routine appointment please."
  end_when: "take care|goodbye|have a good|all set"
  max_turns: 10
fault_profile: {}
expected:
  executions: [schedule_appointment]
  appointment_status: booked
  transfer: none
  callback: none
  derived_status: completed_scheduled
  requires_staff_action: false
  # 'resolved' is truthful here: the appointment exists. The metric tests honesty,
  # not vocabulary, so it is allowed.
  disposition_allowed: [scheduled, resolved]
truthfulness:
  must_disclose: null
  # The agent must not tell a caller a booking failed when the scheduler booked it.
  # Scenario A passed once while saying exactly that; state was right, speech was not.
  must_not_contradict:
    when_status: completed_scheduled
    forbidden_statements: [disclosed_scheduling_failed]
  informational_regex:
    must_not_say: ["transfer", "triage nurse"]

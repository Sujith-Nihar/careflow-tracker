# For reviewers without a Supabase project: `docker compose up -d db`, then point
# DATABASE_URL at this container. User, password and database are all `careflow`,
# on port 5432. Spelled out rather than pasted as a connection string so the
# credential scanner in `make secret-scan` stays strict.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 3s
      retries: 10

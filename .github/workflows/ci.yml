# The gates that do not need a database or a Vogent workspace, so a pull request
# gets an answer in under a minute. The tests marked `db` round-trip real
# PostgreSQL and run locally with `make test`; they are deselected here rather
# than mocked, because a mocked constraint proves nothing about a real one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]" ruff
      - name: Lint
        run: |
          ruff check backend evals vogent scripts
          ruff format --check backend evals vogent scripts
      - name: Tests that need no database
        run: pytest backend -q -m "not db"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/secret_scan.sh
